name: Deploy WeSign Backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'wesigndev'
        type: choice
        options:
          - wesigndev
          - wesignprod
  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'wesigndev'
        type: string

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

permissions:
  id-token: write
  contents: read

concurrency:
  group: wesign-deploy
  cancel-in-progress: false

jobs:
  # ============================================================
  # Job 1: Upload source code to S3 for on-server build
  # (Private NuGet packages require building inside the network)
  # ============================================================
  upload-source:
    name: Upload Source to S3
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'wesigndev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package backend source
        run: |
          cd user-backend
          tar czf ../backend-source.tar.gz \
            --exclude='.git' \
            --exclude='bin' \
            --exclude='obj' \
            --exclude='packages' \
            --exclude='node_modules' \
            .
          ls -lh ../backend-source.tar.gz

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload source to S3
        run: |
          aws s3 cp backend-source.tar.gz \
            "s3://${{ vars.ARTIFACT_BUCKET }}/deploy/backend/${{ github.run_id }}/backend-source.tar.gz"
          echo "Source uploaded to S3"

  # ============================================================
  # Job 2: Build on APP1 + Deploy to APP1
  # ============================================================
  deploy-app1:
    name: Build & Deploy to APP1
    runs-on: ubuntu-latest
    needs: upload-source
    environment: ${{ inputs.environment || 'wesigndev' }}
    env:
      INSTANCE_ID: ${{ vars.APP1_INSTANCE_ID }}
      BUCKET: ${{ vars.ARTIFACT_BUCKET }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deregister APP1 from target groups
        run: |
          for TG in "${{ vars.TG_APP_ARN }}" "${{ vars.TG_HTTPS_ARN }}" "${{ vars.TG_MGMT_ARN }}"; do
            echo "Deregistering from: $TG"
            aws elbv2 deregister-targets \
              --target-group-arn "$TG" \
              --targets "Id=${{ vars.APP1_INSTANCE_ID }}" \
              --region "${{ vars.AWS_REGION }}"
          done
          echo "APP1 deregistered from all target groups"

      - name: Wait for connection drain
        run: sleep 30

      - name: "SSM: Backup + Build + Deploy on APP1"
        run: |
          cat > /tmp/build-deploy.ps1 << 'PSEOF'
          $ErrorActionPreference = 'Stop'

          # ── Configuration ──
          $runId = 'RUN_ID_PLACEHOLDER'
          $bucket = 'BUCKET_PLACEHOLDER'
          $region = 'REGION_PLACEHOLDER'
          $nugetFeed = 'NUGET_FEED_PLACEHOLDER'
          $basePath = 'C:\Comda\Wesign\Sites'
          $backupBase = 'C:\Comda\Wesign\Backups'
          $buildDir = "C:\Comda\Wesign\BuildTemp\backend-$runId"
          $timestamp = Get-Date -Format 'yyyyMMdd_HHmmss'

          $services = @{
              'UserBackend'       = 'WeSign\WeSign.csproj'
              'SignerBackend'     = 'WeSignSigner\WeSignSigner.csproj'
              'ManagementBackend' = 'WeSignManagement\WeSignManagement.csproj'
              'WSEAuth'           = 'WSE-ADAuth\WSE-ADAuth.csproj'
              'PdfExternalService'= 'PdfExternalService\PdfExternalService.csproj'
              'HistoryService'    = 'MongoIntegratorService\HistoryIntegratorService.csproj'
          }
          $pools = @('UserApi','SignerApi','ManagementApi','WseAuth','PdfExternalConvertor','HistoryServiceApi')

          # ── Step 1: Backup current sites ──
          Write-Host '=== STEP 1: Backup ==='
          foreach ($svc in $services.Keys) {
              $src = Join-Path $basePath $svc
              $dst = Join-Path $backupBase "$svc\backup_$timestamp"
              if (Test-Path $src) {
                  New-Item -ItemType Directory -Path $dst -Force | Out-Null
                  Copy-Item "$src\*" $dst -Recurse -Force
                  Write-Host "Backed up: $svc"
              }
              # Keep last 5 backups
              $bkDir = Join-Path $backupBase $svc
              if (Test-Path $bkDir) {
                  Get-ChildItem $bkDir -Directory |
                      Where-Object { $_.Name -match '^backup_' } |
                      Sort-Object Name -Descending | Select-Object -Skip 5 |
                      ForEach-Object { Remove-Item $_.FullName -Recurse -Force }
              }
          }

          # ── Step 2: Download source and build ──
          Write-Host '=== STEP 2: Build ==='
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null

          # Download source
          Write-Host 'Downloading source from S3...'
          $tarPath = "$buildDir\backend-source.tar.gz"
          aws s3 cp "s3://$bucket/deploy/backend/$runId/backend-source.tar.gz" $tarPath --region $region
          if ($LASTEXITCODE -ne 0) { throw "S3 download failed" }

          # Extract (using tar which is available on Win Server 2019+)
          Write-Host 'Extracting source...'
          $srcDir = "$buildDir\src"
          New-Item -ItemType Directory -Path $srcDir -Force | Out-Null
          tar -xzf $tarPath -C $srcDir
          if ($LASTEXITCODE -ne 0) { throw "tar extraction failed" }

          # Add private NuGet source if configured
          if ($nugetFeed -and $nugetFeed -ne '' -and $nugetFeed -ne 'NUGET_FEED_PLACEHOLDER') {
              Write-Host "Adding private NuGet source: $nugetFeed"
              dotnet nuget add source $nugetFeed --name comda-private 2>$null
              if ($LASTEXITCODE -ne 0) {
                  Write-Host "Source may already exist, updating..."
                  dotnet nuget update source comda-private --source $nugetFeed 2>$null
              }
          }

          # Restore
          Write-Host 'Restoring NuGet packages...'
          $slnPath = Get-ChildItem $srcDir -Filter '*.sln' -Recurse | Select-Object -First 1
          if (-not $slnPath) { throw "No .sln file found" }
          dotnet restore $slnPath.FullName
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed" }

          # Publish each service
          $publishBase = "$buildDir\publish"
          foreach ($svc in $services.Keys) {
              $proj = Join-Path $srcDir $services[$svc]
              $pubOut = Join-Path $publishBase $svc
              Write-Host "Publishing $svc..."
              dotnet publish $proj -c Release -r win-x64 --self-contained false -o $pubOut --no-restore
              if ($LASTEXITCODE -ne 0) { throw "Publish failed for $svc" }

              # Strip config files (server has its own)
              Remove-Item "$pubOut\appsettings.json" -ErrorAction SilentlyContinue
              Remove-Item "$pubOut\appsettings.*.json" -ErrorAction SilentlyContinue -Force
              Get-ChildItem $pubOut -Filter 'appsettings.*.json' | Remove-Item -Force
              Remove-Item "$pubOut\web.config" -ErrorAction SilentlyContinue
              Write-Host "Published $svc (config stripped)"
          }

          # ── Step 3: Stop IIS pools ──
          Write-Host '=== STEP 3: Stop IIS Pools ==='
          Import-Module WebAdministration
          foreach ($pool in $pools) {
              try {
                  if ((Get-WebAppPoolState -Name $pool).Value -eq 'Started') {
                      Stop-WebAppPool -Name $pool
                      Write-Host "Stopped: $pool"
                  }
              } catch { Write-Host "Pool $pool not found or error: $_" }
          }
          Start-Sleep -Seconds 10

          # ── Step 4: Deploy ──
          Write-Host '=== STEP 4: Deploy ==='
          foreach ($svc in $services.Keys) {
              $target = Join-Path $basePath $svc
              $pubOut = Join-Path $publishBase $svc

              # Save config files
              $savedConfigs = @{}
              foreach ($cfg in @('appsettings.json','web.config')) {
                  $cfgPath = Join-Path $target $cfg
                  if (Test-Path $cfgPath) {
                      $savedConfigs[$cfg] = Get-Content $cfgPath -Raw
                  }
              }

              # Copy new files
              if (-not (Test-Path $target)) { New-Item -ItemType Directory -Path $target -Force | Out-Null }
              Copy-Item "$pubOut\*" $target -Recurse -Force

              # Restore config files
              foreach ($cfg in $savedConfigs.Keys) {
                  Set-Content -Path (Join-Path $target $cfg) -Value $savedConfigs[$cfg] -NoNewline
                  Write-Host "Preserved: $svc\$cfg"
              }
              Write-Host "Deployed: $svc"
          }

          # ── Step 5: Start IIS pools ──
          Write-Host '=== STEP 5: Start IIS Pools ==='
          foreach ($pool in $pools) {
              try {
                  Start-WebAppPool -Name $pool
                  Write-Host "Started: $pool"
              } catch { Write-Host "Pool $pool error: $_" }
          }

          # ── Step 6: Upload built artifacts to S3 for APP2 ──
          Write-Host '=== STEP 6: Upload artifacts for APP2 ==='
          foreach ($svc in $services.Keys) {
              $pubOut = Join-Path $publishBase $svc
              $zipPath = "$buildDir\$svc.zip"
              Compress-Archive -Path "$pubOut\*" -DestinationPath $zipPath -Force
              aws s3 cp $zipPath "s3://$bucket/deploy/backend/$runId/$svc.zip" --region $region
              if ($LASTEXITCODE -ne 0) { Write-Warning "Failed to upload $svc.zip" }
              Write-Host "Uploaded: $svc.zip"
          }

          # ── Step 7: Health check ──
          Write-Host '=== STEP 7: Health Check ==='
          $endpoints = @(
              @{Name='UserBackend'; Url='https://localhost/userApi/'},
              @{Name='SignerBackend'; Url='https://localhost/signerApi/'},
              @{Name='ManagementBackend'; Url='https://localhost:10443/managementApi/'},
              @{Name='WSEAuth'; Url='https://localhost/auth/'}
          )
          $failed = @()
          foreach ($ep in $endpoints) {
              $ok = $false
              for ($i = 1; $i -le 12; $i++) {
                  try {
                      $r = Invoke-WebRequest -Uri $ep.Url -UseBasicParsing -TimeoutSec 10 -SkipCertificateCheck
                      if ($r.StatusCode -lt 500) { $ok = $true; Write-Host "$($ep.Name): OK (HTTP $($r.StatusCode))"; break }
                  } catch { Write-Host "$($ep.Name) attempt ${i}: $_" }
                  Start-Sleep -Seconds 5
              }
              if (-not $ok) { $failed += $ep.Name }
          }

          # Cleanup build temp
          Remove-Item $buildDir -Recurse -Force -ErrorAction SilentlyContinue

          if ($failed.Count -gt 0) {
              Write-Error "Health check failed: $($failed -join ', ')"
              exit 1
          }
          Write-Host 'All health checks passed - APP1 build and deploy complete'
          PSEOF

          # Replace placeholders
          sed -i "s|RUN_ID_PLACEHOLDER|${{ github.run_id }}|g" /tmp/build-deploy.ps1
          sed -i "s|BUCKET_PLACEHOLDER|${{ vars.ARTIFACT_BUCKET }}|g" /tmp/build-deploy.ps1
          sed -i "s|REGION_PLACEHOLDER|${{ vars.AWS_REGION }}|g" /tmp/build-deploy.ps1
          sed -i "s|NUGET_FEED_PLACEHOLDER|${{ vars.NUGET_FEED_URL }}|g" /tmp/build-deploy.ps1

          # Upload script to S3
          SCRIPT_KEY="deploy/scripts/${{ github.run_id }}/app1-build-deploy.ps1"
          aws s3 cp /tmp/build-deploy.ps1 "s3://$BUCKET/$SCRIPT_KEY"

          # Execute via SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters "{\"commands\":[\"aws s3 cp s3://$BUCKET/$SCRIPT_KEY C:\\\\Temp\\\\build-deploy.ps1 --region $AWS_REGION; powershell -ExecutionPolicy Bypass -File C:\\\\Temp\\\\build-deploy.ps1\"]}" \
            --region "$AWS_REGION" \
            --timeout-seconds 900 \
            --query "Command.CommandId" --output text | tr -d '\r')

          echo "SSM Command ID: $COMMAND_ID"

          # Poll for completion (up to 15 minutes for build)
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "InProgress")
            STATUS=$(echo "$STATUS" | tr -d '\r')

            if [ "$STATUS" = "Success" ]; then
              echo "=== Output ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "SSM command failed: $STATUS"
              echo "=== STDERR ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardErrorContent" --output text
              echo "=== STDOUT ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              exit 1
            fi
            echo "  Waiting... ($i/90) status=$STATUS"
            sleep 10
          done

          [ "$STATUS" != "Success" ] && echo "Timed out waiting for SSM build+deploy" && exit 1

      - name: Register APP1 in target groups
        run: |
          aws elbv2 register-targets \
            --target-group-arn "${{ vars.TG_APP_ARN }}" \
            --targets "Id=${{ vars.APP1_INSTANCE_ID }},Port=80" \
            --region "${{ vars.AWS_REGION }}"
          aws elbv2 register-targets \
            --target-group-arn "${{ vars.TG_HTTPS_ARN }}" \
            --targets "Id=${{ vars.APP1_INSTANCE_ID }},Port=443" \
            --region "${{ vars.AWS_REGION }}"
          aws elbv2 register-targets \
            --target-group-arn "${{ vars.TG_MGMT_ARN }}" \
            --targets "Id=${{ vars.APP1_INSTANCE_ID }},Port=10443" \
            --region "${{ vars.AWS_REGION }}"
          echo "APP1 registered in all target groups"

      - name: Wait for APP1 healthy
        run: |
          for TG in "${{ vars.TG_APP_ARN }}" "${{ vars.TG_HTTPS_ARN }}" "${{ vars.TG_MGMT_ARN }}"; do
            for attempt in $(seq 1 30); do
              HEALTH=$(aws elbv2 describe-target-health \
                --target-group-arn "$TG" \
                --targets "Id=${{ vars.APP1_INSTANCE_ID }}" \
                --region "${{ vars.AWS_REGION }}" \
                --query "TargetHealthDescriptions[0].TargetHealth.State" \
                --output text 2>/dev/null | tr -d '\r' || echo "unknown")
              if [ "$HEALTH" = "healthy" ]; then
                echo "APP1 healthy in $TG"
                break
              fi
              echo "  Attempt $attempt: $HEALTH"
              sleep 10
            done
            [ "$HEALTH" != "healthy" ] && echo "WARNING: APP1 not healthy in $TG"
          done

      - name: "Rollback APP1 on failure"
        if: failure()
        run: |
          echo "=== ROLLBACK APP1 ==="
          cat > /tmp/rollback.ps1 << 'PSEOF'
          $ErrorActionPreference = 'Stop'
          Import-Module WebAdministration
          $pools = @('UserApi','SignerApi','ManagementApi','WseAuth','PdfExternalConvertor','HistoryServiceApi')
          $services = @('UserBackend','SignerBackend','ManagementBackend','WSEAuth','PdfExternalService','HistoryService')

          foreach ($pool in $pools) {
              try { if ((Get-WebAppPoolState -Name $pool).Value -eq 'Started') { Stop-WebAppPool -Name $pool } } catch {}
          }
          Start-Sleep -Seconds 10

          foreach ($svc in $services) {
              $backupDir = "C:\Comda\Wesign\Backups\$svc"
              $latest = Get-ChildItem $backupDir -Directory | Where-Object { $_.Name -match '^backup_' } | Sort-Object Name -Descending | Select-Object -First 1
              if ($latest) {
                  $target = "C:\Comda\Wesign\Sites\$svc"
                  $savedConfigs = @{}
                  foreach ($cfg in @('appsettings.json','web.config')) {
                      $cfgPath = Join-Path $target $cfg
                      if (Test-Path $cfgPath) { $savedConfigs[$cfg] = Get-Content $cfgPath -Raw }
                  }
                  Copy-Item "$($latest.FullName)\*" $target -Recurse -Force
                  foreach ($cfg in $savedConfigs.Keys) {
                      Set-Content -Path (Join-Path $target $cfg) -Value $savedConfigs[$cfg] -NoNewline
                  }
                  Write-Host "Restored: $svc"
              }
          }
          foreach ($pool in $pools) { try { Start-WebAppPool -Name $pool } catch {} }
          Write-Host 'Rollback complete'
          PSEOF

          SCRIPT_KEY="deploy/scripts/${{ github.run_id }}/app1-rollback.ps1"
          aws s3 cp /tmp/rollback.ps1 "s3://$BUCKET/$SCRIPT_KEY"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters "{\"commands\":[\"aws s3 cp s3://$BUCKET/$SCRIPT_KEY C:\\\\Temp\\\\script.ps1 --region $AWS_REGION; powershell -ExecutionPolicy Bypass -File C:\\\\Temp\\\\script.ps1\"]}" \
            --region "$AWS_REGION" \
            --timeout-seconds 600 \
            --query "Command.CommandId" --output text | tr -d '\r')

          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "Status" --output text 2>/dev/null || echo "InProgress")
            STATUS=$(echo "$STATUS" | tr -d '\r')
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              break
            fi
            sleep 10
          done

          # Re-register APP1
          aws elbv2 register-targets --target-group-arn "${{ vars.TG_APP_ARN }}" --targets "Id=${{ vars.APP1_INSTANCE_ID }},Port=80" --region "${{ vars.AWS_REGION }}" || true
          aws elbv2 register-targets --target-group-arn "${{ vars.TG_HTTPS_ARN }}" --targets "Id=${{ vars.APP1_INSTANCE_ID }},Port=443" --region "${{ vars.AWS_REGION }}" || true
          aws elbv2 register-targets --target-group-arn "${{ vars.TG_MGMT_ARN }}" --targets "Id=${{ vars.APP1_INSTANCE_ID }},Port=10443" --region "${{ vars.AWS_REGION }}" || true
          echo "APP1 re-registered after rollback"

  # ============================================================
  # Job 3: Deploy pre-built artifacts to APP2
  # ============================================================
  deploy-app2:
    name: Deploy to APP2
    runs-on: ubuntu-latest
    needs: deploy-app1
    environment: ${{ inputs.environment || 'wesigndev' }}
    env:
      INSTANCE_ID: ${{ vars.APP2_INSTANCE_ID }}
      BUCKET: ${{ vars.ARTIFACT_BUCKET }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deregister APP2 from target groups
        run: |
          for TG in "${{ vars.TG_APP_ARN }}" "${{ vars.TG_HTTPS_ARN }}" "${{ vars.TG_MGMT_ARN }}"; do
            echo "Deregistering from: $TG"
            aws elbv2 deregister-targets \
              --target-group-arn "$TG" \
              --targets "Id=${{ vars.APP2_INSTANCE_ID }}" \
              --region "${{ vars.AWS_REGION }}"
          done

      - name: Wait for connection drain
        run: sleep 30

      - name: "SSM: Backup + Deploy on APP2"
        run: |
          cat > /tmp/deploy-app2.ps1 << 'PSEOF'
          $ErrorActionPreference = 'Stop'

          $runId = 'RUN_ID_PLACEHOLDER'
          $bucket = 'BUCKET_PLACEHOLDER'
          $region = 'REGION_PLACEHOLDER'
          $basePath = 'C:\Comda\Wesign\Sites'
          $backupBase = 'C:\Comda\Wesign\Backups'
          $temp = "C:\Comda\Wesign\DeployTemp\backend-$runId"
          $timestamp = Get-Date -Format 'yyyyMMdd_HHmmss'

          $services = @('UserBackend','SignerBackend','ManagementBackend','WSEAuth','PdfExternalService','HistoryService')
          $pools = @('UserApi','SignerApi','ManagementApi','WseAuth','PdfExternalConvertor','HistoryServiceApi')

          # ── Backup ──
          Write-Host '=== Backup ==='
          foreach ($svc in $services) {
              $src = Join-Path $basePath $svc
              $dst = Join-Path $backupBase "$svc\backup_$timestamp"
              if (Test-Path $src) {
                  New-Item -ItemType Directory -Path $dst -Force | Out-Null
                  Copy-Item "$src\*" $dst -Recurse -Force
                  Write-Host "Backed up: $svc"
              }
              $bkDir = Join-Path $backupBase $svc
              if (Test-Path $bkDir) {
                  Get-ChildItem $bkDir -Directory |
                      Where-Object { $_.Name -match '^backup_' } |
                      Sort-Object Name -Descending | Select-Object -Skip 5 |
                      ForEach-Object { Remove-Item $_.FullName -Recurse -Force }
              }
          }

          # ── Stop Pools ──
          Write-Host '=== Stop IIS Pools ==='
          Import-Module WebAdministration
          foreach ($pool in $pools) {
              try {
                  if ((Get-WebAppPoolState -Name $pool).Value -eq 'Started') {
                      Stop-WebAppPool -Name $pool
                      Write-Host "Stopped: $pool"
                  }
              } catch { Write-Host "Pool $pool: $_" }
          }
          Start-Sleep -Seconds 10

          # ── Download and Deploy ──
          Write-Host '=== Deploy ==='
          New-Item -ItemType Directory -Path $temp -Force | Out-Null
          foreach ($svc in $services) {
              $target = Join-Path $basePath $svc
              $zipPath = "$temp\$svc.zip"

              # Download pre-built artifact from S3
              aws s3 cp "s3://$bucket/deploy/backend/$runId/$svc.zip" $zipPath --region $region
              if ($LASTEXITCODE -ne 0) { throw "Failed to download $svc.zip" }

              # Save configs
              $savedConfigs = @{}
              foreach ($cfg in @('appsettings.json','web.config')) {
                  $cfgPath = Join-Path $target $cfg
                  if (Test-Path $cfgPath) { $savedConfigs[$cfg] = Get-Content $cfgPath -Raw }
              }

              # Extract and deploy
              $extractDir = "$temp\$svc"
              Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
              if (-not (Test-Path $target)) { New-Item -ItemType Directory -Path $target -Force | Out-Null }
              Copy-Item "$extractDir\*" $target -Recurse -Force

              # Restore configs
              foreach ($cfg in $savedConfigs.Keys) {
                  Set-Content -Path (Join-Path $target $cfg) -Value $savedConfigs[$cfg] -NoNewline
                  Write-Host "Preserved: $svc\$cfg"
              }
              Write-Host "Deployed: $svc"
          }

          # ── Start Pools ──
          Write-Host '=== Start IIS Pools ==='
          foreach ($pool in $pools) {
              try { Start-WebAppPool -Name $pool; Write-Host "Started: $pool" } catch { Write-Host "Pool $pool: $_" }
          }

          # ── Health Check ──
          Write-Host '=== Health Check ==='
          $endpoints = @(
              @{Name='UserBackend'; Url='https://localhost/userApi/'},
              @{Name='SignerBackend'; Url='https://localhost/signerApi/'},
              @{Name='ManagementBackend'; Url='https://localhost:10443/managementApi/'},
              @{Name='WSEAuth'; Url='https://localhost/auth/'}
          )
          $failed = @()
          foreach ($ep in $endpoints) {
              $ok = $false
              for ($i = 1; $i -le 12; $i++) {
                  try {
                      $r = Invoke-WebRequest -Uri $ep.Url -UseBasicParsing -TimeoutSec 10 -SkipCertificateCheck
                      if ($r.StatusCode -lt 500) { $ok = $true; Write-Host "$($ep.Name): OK (HTTP $($r.StatusCode))"; break }
                  } catch { Write-Host "$($ep.Name) attempt ${i}: $_" }
                  Start-Sleep -Seconds 5
              }
              if (-not $ok) { $failed += $ep.Name }
          }

          Remove-Item $temp -Recurse -Force -ErrorAction SilentlyContinue
          if ($failed.Count -gt 0) { Write-Error "Health check failed: $($failed -join ', ')"; exit 1 }
          Write-Host 'APP2 deploy complete'
          PSEOF

          sed -i "s|RUN_ID_PLACEHOLDER|${{ github.run_id }}|g" /tmp/deploy-app2.ps1
          sed -i "s|BUCKET_PLACEHOLDER|${{ vars.ARTIFACT_BUCKET }}|g" /tmp/deploy-app2.ps1
          sed -i "s|REGION_PLACEHOLDER|${{ vars.AWS_REGION }}|g" /tmp/deploy-app2.ps1

          SCRIPT_KEY="deploy/scripts/${{ github.run_id }}/app2-deploy.ps1"
          aws s3 cp /tmp/deploy-app2.ps1 "s3://$BUCKET/$SCRIPT_KEY"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters "{\"commands\":[\"aws s3 cp s3://$BUCKET/$SCRIPT_KEY C:\\\\Temp\\\\deploy-app2.ps1 --region $AWS_REGION; powershell -ExecutionPolicy Bypass -File C:\\\\Temp\\\\deploy-app2.ps1\"]}" \
            --region "$AWS_REGION" \
            --timeout-seconds 600 \
            --query "Command.CommandId" --output text | tr -d '\r')

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "InProgress")
            STATUS=$(echo "$STATUS" | tr -d '\r')

            if [ "$STATUS" = "Success" ]; then
              echo "=== Output ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "SSM command failed: $STATUS"
              echo "=== STDERR ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardErrorContent" --output text
              echo "=== STDOUT ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              exit 1
            fi
            echo "  Waiting... ($i/90) status=$STATUS"
            sleep 10
          done

          [ "$STATUS" != "Success" ] && echo "Timed out" && exit 1

      - name: Register APP2 in target groups
        run: |
          aws elbv2 register-targets \
            --target-group-arn "${{ vars.TG_APP_ARN }}" \
            --targets "Id=${{ vars.APP2_INSTANCE_ID }},Port=80" \
            --region "${{ vars.AWS_REGION }}"
          aws elbv2 register-targets \
            --target-group-arn "${{ vars.TG_HTTPS_ARN }}" \
            --targets "Id=${{ vars.APP2_INSTANCE_ID }},Port=443" \
            --region "${{ vars.AWS_REGION }}"
          aws elbv2 register-targets \
            --target-group-arn "${{ vars.TG_MGMT_ARN }}" \
            --targets "Id=${{ vars.APP2_INSTANCE_ID }},Port=10443" \
            --region "${{ vars.AWS_REGION }}"

      - name: Wait for APP2 healthy
        run: |
          for TG in "${{ vars.TG_APP_ARN }}" "${{ vars.TG_HTTPS_ARN }}" "${{ vars.TG_MGMT_ARN }}"; do
            for attempt in $(seq 1 30); do
              HEALTH=$(aws elbv2 describe-target-health \
                --target-group-arn "$TG" \
                --targets "Id=${{ vars.APP2_INSTANCE_ID }}" \
                --region "${{ vars.AWS_REGION }}" \
                --query "TargetHealthDescriptions[0].TargetHealth.State" \
                --output text 2>/dev/null | tr -d '\r' || echo "unknown")
              if [ "$HEALTH" = "healthy" ]; then
                echo "APP2 healthy in $TG"
                break
              fi
              echo "  Attempt $attempt: $HEALTH"
              sleep 10
            done
            [ "$HEALTH" != "healthy" ] && echo "WARNING: APP2 not healthy in $TG"
          done

      - name: "Rollback APP2 on failure"
        if: failure()
        run: |
          echo "=== ROLLBACK APP2 ==="
          cat > /tmp/rollback.ps1 << 'PSEOF'
          $ErrorActionPreference = 'Stop'
          Import-Module WebAdministration
          $pools = @('UserApi','SignerApi','ManagementApi','WseAuth','PdfExternalConvertor','HistoryServiceApi')
          $services = @('UserBackend','SignerBackend','ManagementBackend','WSEAuth','PdfExternalService','HistoryService')

          foreach ($pool in $pools) {
              try { if ((Get-WebAppPoolState -Name $pool).Value -eq 'Started') { Stop-WebAppPool -Name $pool } } catch {}
          }
          Start-Sleep -Seconds 10

          foreach ($svc in $services) {
              $backupDir = "C:\Comda\Wesign\Backups\$svc"
              $latest = Get-ChildItem $backupDir -Directory | Where-Object { $_.Name -match '^backup_' } | Sort-Object Name -Descending | Select-Object -First 1
              if ($latest) {
                  $target = "C:\Comda\Wesign\Sites\$svc"
                  $savedConfigs = @{}
                  foreach ($cfg in @('appsettings.json','web.config')) {
                      $cfgPath = Join-Path $target $cfg
                      if (Test-Path $cfgPath) { $savedConfigs[$cfg] = Get-Content $cfgPath -Raw }
                  }
                  Copy-Item "$($latest.FullName)\*" $target -Recurse -Force
                  foreach ($cfg in $savedConfigs.Keys) {
                      Set-Content -Path (Join-Path $target $cfg) -Value $savedConfigs[$cfg] -NoNewline
                  }
                  Write-Host "Restored: $svc"
              }
          }
          foreach ($pool in $pools) { try { Start-WebAppPool -Name $pool } catch {} }
          Write-Host 'Rollback complete'
          PSEOF

          SCRIPT_KEY="deploy/scripts/${{ github.run_id }}/app2-rollback.ps1"
          aws s3 cp /tmp/rollback.ps1 "s3://$BUCKET/$SCRIPT_KEY"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters "{\"commands\":[\"aws s3 cp s3://$BUCKET/$SCRIPT_KEY C:\\\\Temp\\\\script.ps1 --region $AWS_REGION; powershell -ExecutionPolicy Bypass -File C:\\\\Temp\\\\script.ps1\"]}" \
            --region "$AWS_REGION" \
            --timeout-seconds 600 \
            --query "Command.CommandId" --output text | tr -d '\r')

          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "Status" --output text 2>/dev/null || echo "InProgress")
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              break
            fi
            sleep 10
          done

          aws elbv2 register-targets --target-group-arn "${{ vars.TG_APP_ARN }}" --targets "Id=${{ vars.APP2_INSTANCE_ID }},Port=80" --region "${{ vars.AWS_REGION }}" || true
          aws elbv2 register-targets --target-group-arn "${{ vars.TG_HTTPS_ARN }}" --targets "Id=${{ vars.APP2_INSTANCE_ID }},Port=443" --region "${{ vars.AWS_REGION }}" || true
          aws elbv2 register-targets --target-group-arn "${{ vars.TG_MGMT_ARN }}" --targets "Id=${{ vars.APP2_INSTANCE_ID }},Port=10443" --region "${{ vars.AWS_REGION }}" || true
          echo "APP2 re-registered after rollback"

  # ============================================================
  # Job 4: Notifications
  # ============================================================
  notify:
    name: Notify Teams
    runs-on: ubuntu-latest
    needs: [deploy-app1, deploy-app2]
    if: always()
    environment: ${{ inputs.environment || 'wesigndev' }}
    steps:
      - name: Send Teams notification
        run: |
          APP1_STATUS="${{ needs.deploy-app1.result }}"
          APP2_STATUS="${{ needs.deploy-app2.result }}"

          if [ "$APP1_STATUS" = "success" ] && [ "$APP2_STATUS" = "success" ]; then
            STATUS_TEXT="Succeeded"
            STATUS_ICON="&#x2705;"
          else
            STATUS_TEXT="Failed"
            STATUS_ICON="&#x274C;"
          fi

          cat > /tmp/teams-card.json << JSONEOF
          {
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.4",
                  "body": [
                    {
                      "type": "TextBlock",
                      "size": "Large",
                      "weight": "Bolder",
                      "text": "${STATUS_ICON} WeSign Backend Deploy: ${STATUS_TEXT}"
                    },
                    {
                      "type": "FactSet",
                      "facts": [
                        {"title": "Repository", "value": "${{ github.repository }}"},
                        {"title": "Branch", "value": "${{ github.ref_name }}"},
                        {"title": "Run", "value": "#${{ github.run_number }}"},
                        {"title": "Triggered by", "value": "${{ github.actor }}"},
                        {"title": "APP1", "value": "${APP1_STATUS}"},
                        {"title": "APP2", "value": "${APP2_STATUS}"}
                      ]
                    }
                  ],
                  "actions": [
                    {
                      "type": "Action.OpenUrl",
                      "title": "View Run",
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              }
            ]
          }
          JSONEOF

          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d @/tmp/teams-card.json \
            "${{ secrets.TEAMS_WEBHOOK_URL }}" || echo "WARNING: Teams notification failed"
