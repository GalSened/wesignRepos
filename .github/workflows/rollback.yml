name: WeSign Rollback

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to rollback'
        required: true
        type: choice
        options:
          - backend
          - user-client
          - mgmt-client
          - signer-client
          - all
      confirm:
        description: 'Type ROLLBACK to confirm'
        required: true
        type: string
      server:
        description: 'Target server(s)'
        required: true
        type: choice
        options:
          - both
          - APP1-only
          - APP2-only

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

concurrency:
  group: wesign-deploy
  cancel-in-progress: false

jobs:
  # ============================================================
  # Job 1: Validate confirmation
  # ============================================================
  validate:
    name: Validate Rollback Confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "ROLLBACK" ]; then
            echo "ERROR: You must type 'ROLLBACK' to confirm. Got: '${{ inputs.confirm }}'"
            exit 1
          fi
          echo "Rollback confirmed for component=${{ inputs.component }}, server=${{ inputs.server }}"

  # ============================================================
  # Job 2: Rollback APP1
  # ============================================================
  rollback-app1:
    name: Rollback APP1
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ inputs.server == 'both' || inputs.server == 'APP1-only' }}
    environment: wesigndev
    env:
      INSTANCE_ID: ${{ vars.APP1_INSTANCE_ID }}
      BUCKET: ${{ vars.ARTIFACT_BUCKET }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deregister APP1 from target groups
        run: |
          for TG in "${{ vars.TG_APP_ARN }}" "${{ vars.TG_HTTPS_ARN }}" "${{ vars.TG_MGMT_ARN }}"; do
            echo "Deregistering APP1 from $TG..."
            aws elbv2 deregister-targets \
              --target-group-arn "$TG" \
              --targets "Id=${{ vars.APP1_INSTANCE_ID }}"
          done

      - name: Wait for connection drain
        run: |
          echo "Waiting 30s for connections to drain..."
          sleep 30

      - name: "SSM: Rollback backend"
        if: ${{ inputs.component == 'backend' || inputs.component == 'all' }}
        run: |
          cat > /tmp/rollback-backend.ps1 << 'PSEOF'
          $ErrorActionPreference = 'Stop'
          Import-Module WebAdministration

          # Stop pools
          $pools = @('UserApi','SignerApi','ManagementApi','WseAuth','PdfExternalConvertor','HistoryServiceApi')
          foreach ($pool in $pools) {
              if ((Get-WebAppPoolState -Name $pool).Value -eq 'Started') { Stop-WebAppPool -Name $pool }
          }
          Start-Sleep -Seconds 10

          # Restore from latest backup
          $services = @('UserBackend','SignerBackend','ManagementBackend','WSEAuth','PdfExternalService','HistoryService')
          foreach ($svc in $services) {
              $backupDir = "C:\Comda\Wesign\Backups\$svc"
              $latest = Get-ChildItem $backupDir -Directory | Where-Object { $_.Name -match '^backup_' } | Sort-Object Name -Descending | Select-Object -First 1
              if ($latest) {
                  $target = "C:\Comda\Wesign\Sites\$svc"
                  # Save config
                  $savedConfigs = @{}
                  foreach ($cfg in @('appsettings.json','web.config')) {
                      $cfgPath = Join-Path $target $cfg
                      if (Test-Path $cfgPath) { $savedConfigs[$cfg] = Get-Content $cfgPath -Raw }
                  }
                  # Restore
                  Copy-Item "$($latest.FullName)\*" $target -Recurse -Force
                  # Restore config
                  foreach ($cfg in $savedConfigs.Keys) {
                      Set-Content -Path (Join-Path $target $cfg) -Value $savedConfigs[$cfg] -NoNewline
                  }
                  Write-Host "Restored: $svc from $($latest.Name)"
              } else {
                  Write-Warning "No backup found for $svc"
              }
          }

          # Start pools
          foreach ($pool in $pools) { Start-WebAppPool -Name $pool }
          Write-Host 'Rollback complete'
          PSEOF

          SCRIPT_KEY="deploy/scripts/${{ github.run_id }}/app1-rollback-backend.ps1"
          aws s3 cp /tmp/rollback-backend.ps1 "s3://$BUCKET/$SCRIPT_KEY"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters "{\"commands\":[\"aws s3 cp s3://$BUCKET/$SCRIPT_KEY C:\\\\Temp\\\\script.ps1 --region $AWS_REGION; powershell -ExecutionPolicy Bypass -File C:\\\\Temp\\\\script.ps1\"]}" \
            --region "$AWS_REGION" \
            --timeout-seconds 600 \
            --query "Command.CommandId" --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "InProgress")
            STATUS=$(echo "$STATUS" | tr -d '\r')

            if [ "$STATUS" = "Success" ]; then
              echo "=== Output ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "SSM command failed: $STATUS"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardErrorContent" --output text
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              exit 1
            fi
            sleep 10
          done

          [ "$STATUS" != "Success" ] && echo "Timed out waiting for SSM command" && exit 1

      - name: "SSM: Rollback user-client"
        if: ${{ inputs.component == 'user-client' || inputs.component == 'all' }}
        run: |
          cat > /tmp/rollback-frontend.ps1 << 'PSEOF'
          $component = 'UserFrontend'
          $backupDir = "C:\Comda\Wesign\Backups\$component"
          $target = "C:\Comda\Wesign\Sites\$component"
          $latest = Get-ChildItem $backupDir -Directory | Where-Object { $_.Name -match '^backup_' } | Sort-Object Name -Descending | Select-Object -First 1
          if ($latest) {
              Copy-Item "$($latest.FullName)\*" $target -Recurse -Force
              Write-Host "Restored: $component from $($latest.Name)"
          } else {
              Write-Error "No backup found for $component"
              exit 1
          }
          PSEOF

          SCRIPT_KEY="deploy/scripts/${{ github.run_id }}/app1-rollback-user-client.ps1"
          aws s3 cp /tmp/rollback-frontend.ps1 "s3://$BUCKET/$SCRIPT_KEY"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters "{\"commands\":[\"aws s3 cp s3://$BUCKET/$SCRIPT_KEY C:\\\\Temp\\\\script.ps1 --region $AWS_REGION; powershell -ExecutionPolicy Bypass -File C:\\\\Temp\\\\script.ps1\"]}" \
            --region "$AWS_REGION" \
            --timeout-seconds 300 \
            --query "Command.CommandId" --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "InProgress")
            STATUS=$(echo "$STATUS" | tr -d '\r')

            if [ "$STATUS" = "Success" ]; then
              echo "=== Output ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "SSM command failed: $STATUS"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardErrorContent" --output text
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              exit 1
            fi
            sleep 10
          done

          [ "$STATUS" != "Success" ] && echo "Timed out waiting for SSM command" && exit 1

      - name: "SSM: Rollback mgmt-client"
        if: ${{ inputs.component == 'mgmt-client' || inputs.component == 'all' }}
        run: |
          cat > /tmp/rollback-frontend.ps1 << 'PSEOF'
          $component = 'ManagementFrontend'
          $backupDir = "C:\Comda\Wesign\Backups\$component"
          $target = "C:\Comda\Wesign\Sites\$component"
          $latest = Get-ChildItem $backupDir -Directory | Where-Object { $_.Name -match '^backup_' } | Sort-Object Name -Descending | Select-Object -First 1
          if ($latest) {
              Copy-Item "$($latest.FullName)\*" $target -Recurse -Force
              Write-Host "Restored: $component from $($latest.Name)"
          } else {
              Write-Error "No backup found for $component"
              exit 1
          }
          PSEOF

          SCRIPT_KEY="deploy/scripts/${{ github.run_id }}/app1-rollback-mgmt-client.ps1"
          aws s3 cp /tmp/rollback-frontend.ps1 "s3://$BUCKET/$SCRIPT_KEY"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters "{\"commands\":[\"aws s3 cp s3://$BUCKET/$SCRIPT_KEY C:\\\\Temp\\\\script.ps1 --region $AWS_REGION; powershell -ExecutionPolicy Bypass -File C:\\\\Temp\\\\script.ps1\"]}" \
            --region "$AWS_REGION" \
            --timeout-seconds 300 \
            --query "Command.CommandId" --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "InProgress")
            STATUS=$(echo "$STATUS" | tr -d '\r')

            if [ "$STATUS" = "Success" ]; then
              echo "=== Output ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "SSM command failed: $STATUS"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardErrorContent" --output text
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              exit 1
            fi
            sleep 10
          done

          [ "$STATUS" != "Success" ] && echo "Timed out waiting for SSM command" && exit 1

      - name: "SSM: Rollback signer-client"
        if: ${{ inputs.component == 'signer-client' || inputs.component == 'all' }}
        run: |
          cat > /tmp/rollback-frontend.ps1 << 'PSEOF'
          $component = 'SignerFrontend'
          $backupDir = "C:\Comda\Wesign\Backups\$component"
          $target = "C:\Comda\Wesign\Sites\$component"
          $latest = Get-ChildItem $backupDir -Directory | Where-Object { $_.Name -match '^backup_' } | Sort-Object Name -Descending | Select-Object -First 1
          if ($latest) {
              Copy-Item "$($latest.FullName)\*" $target -Recurse -Force
              Write-Host "Restored: $component from $($latest.Name)"
          } else {
              Write-Error "No backup found for $component"
              exit 1
          }
          PSEOF

          SCRIPT_KEY="deploy/scripts/${{ github.run_id }}/app1-rollback-signer-client.ps1"
          aws s3 cp /tmp/rollback-frontend.ps1 "s3://$BUCKET/$SCRIPT_KEY"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters "{\"commands\":[\"aws s3 cp s3://$BUCKET/$SCRIPT_KEY C:\\\\Temp\\\\script.ps1 --region $AWS_REGION; powershell -ExecutionPolicy Bypass -File C:\\\\Temp\\\\script.ps1\"]}" \
            --region "$AWS_REGION" \
            --timeout-seconds 300 \
            --query "Command.CommandId" --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "InProgress")
            STATUS=$(echo "$STATUS" | tr -d '\r')

            if [ "$STATUS" = "Success" ]; then
              echo "=== Output ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "SSM command failed: $STATUS"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardErrorContent" --output text
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              exit 1
            fi
            sleep 10
          done

          [ "$STATUS" != "Success" ] && echo "Timed out waiting for SSM command" && exit 1

      - name: "SSM: Health check"
        run: |
          cat > /tmp/healthcheck.ps1 << 'PSEOF'
          $ErrorActionPreference = 'Stop'
          $endpoints = @(
              @{Name='UserBackend'; Url='https://localhost/userApi/'},
              @{Name='SignerBackend'; Url='https://localhost/signerApi/'},
              @{Name='ManagementBackend'; Url='https://localhost:10443/managementApi/'},
              @{Name='WSEAuth'; Url='https://localhost/auth/'}
          )
          $maxRetries = 12
          $failed = @()
          foreach ($ep in $endpoints) {
              $ok = $false
              for ($i = 1; $i -le $maxRetries; $i++) {
                  try {
                      $r = Invoke-WebRequest -Uri $ep.Url -UseBasicParsing -TimeoutSec 10 -SkipCertificateCheck
                      if ($r.StatusCode -lt 500) { $ok = $true; Write-Host "$($ep.Name): OK (HTTP $($r.StatusCode))"; break }
                  } catch { Write-Host "$($ep.Name) attempt ${i}: $_" }
                  Start-Sleep -Seconds 5
              }
              if (-not $ok) { $failed += $ep.Name }
          }
          if ($failed.Count -gt 0) { Write-Error "Health check failed: $($failed -join ', ')"; exit 1 }
          Write-Host 'All health checks passed'
          PSEOF

          SCRIPT_KEY="deploy/scripts/${{ github.run_id }}/app1-rollback-healthcheck.ps1"
          aws s3 cp /tmp/healthcheck.ps1 "s3://$BUCKET/$SCRIPT_KEY"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters "{\"commands\":[\"aws s3 cp s3://$BUCKET/$SCRIPT_KEY C:\\\\Temp\\\\script.ps1 --region $AWS_REGION; powershell -ExecutionPolicy Bypass -File C:\\\\Temp\\\\script.ps1\"]}" \
            --region "$AWS_REGION" \
            --timeout-seconds 300 \
            --query "Command.CommandId" --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "InProgress")
            STATUS=$(echo "$STATUS" | tr -d '\r')

            if [ "$STATUS" = "Success" ]; then
              echo "=== Output ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "SSM command failed: $STATUS"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardErrorContent" --output text
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              exit 1
            fi
            sleep 10
          done

          [ "$STATUS" != "Success" ] && echo "Timed out waiting for SSM command" && exit 1

      - name: Register APP1 in target groups
        run: |
          echo "Registering APP1 in TG_APP (port 80)..."
          aws elbv2 register-targets \
            --target-group-arn "${{ vars.TG_APP_ARN }}" \
            --targets "Id=${{ vars.APP1_INSTANCE_ID }},Port=80"

          echo "Registering APP1 in TG_HTTPS (port 443)..."
          aws elbv2 register-targets \
            --target-group-arn "${{ vars.TG_HTTPS_ARN }}" \
            --targets "Id=${{ vars.APP1_INSTANCE_ID }},Port=443"

          echo "Registering APP1 in TG_MGMT (port 10443)..."
          aws elbv2 register-targets \
            --target-group-arn "${{ vars.TG_MGMT_ARN }}" \
            --targets "Id=${{ vars.APP1_INSTANCE_ID }},Port=10443"

      - name: Wait for APP1 to become healthy
        run: |
          echo "Waiting for APP1 to become healthy in target groups..."
          for TG in "${{ vars.TG_APP_ARN }}" "${{ vars.TG_HTTPS_ARN }}" "${{ vars.TG_MGMT_ARN }}"; do
            for attempt in $(seq 1 30); do
              HEALTH=$(aws elbv2 describe-target-health \
                --target-group-arn "$TG" \
                --targets "Id=${{ vars.APP1_INSTANCE_ID }}" \
                --query "TargetHealthDescriptions[0].TargetHealth.State" \
                --output text 2>/dev/null || echo "unknown")
              if [ "$HEALTH" = "healthy" ]; then
                echo "APP1 healthy in $TG"
                break
              fi
              echo "  Attempt $attempt: $HEALTH - waiting..."
              sleep 10
            done
            if [ "$HEALTH" != "healthy" ]; then
              echo "WARNING: APP1 not healthy in $TG after 5 minutes (status: $HEALTH)"
            fi
          done

  # ============================================================
  # Job 3: Rollback APP2
  # ============================================================
  rollback-app2:
    name: Rollback APP2
    runs-on: ubuntu-latest
    needs: [validate, rollback-app1]
    if: |
      always() &&
      (inputs.server == 'both' || inputs.server == 'APP2-only') &&
      (needs.validate.result == 'success') &&
      (needs.rollback-app1.result == 'success' || needs.rollback-app1.result == 'skipped')
    environment: wesigndev
    env:
      INSTANCE_ID: ${{ vars.APP2_INSTANCE_ID }}
      BUCKET: ${{ vars.ARTIFACT_BUCKET }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deregister APP2 from target groups
        run: |
          for TG in "${{ vars.TG_APP_ARN }}" "${{ vars.TG_HTTPS_ARN }}" "${{ vars.TG_MGMT_ARN }}"; do
            echo "Deregistering APP2 from $TG..."
            aws elbv2 deregister-targets \
              --target-group-arn "$TG" \
              --targets "Id=${{ vars.APP2_INSTANCE_ID }}"
          done

      - name: Wait for connection drain
        run: |
          echo "Waiting 30s for connections to drain..."
          sleep 30

      - name: "SSM: Rollback backend"
        if: ${{ inputs.component == 'backend' || inputs.component == 'all' }}
        run: |
          cat > /tmp/rollback-backend.ps1 << 'PSEOF'
          $ErrorActionPreference = 'Stop'
          Import-Module WebAdministration

          # Stop pools
          $pools = @('UserApi','SignerApi','ManagementApi','WseAuth','PdfExternalConvertor','HistoryServiceApi')
          foreach ($pool in $pools) {
              if ((Get-WebAppPoolState -Name $pool).Value -eq 'Started') { Stop-WebAppPool -Name $pool }
          }
          Start-Sleep -Seconds 10

          # Restore from latest backup
          $services = @('UserBackend','SignerBackend','ManagementBackend','WSEAuth','PdfExternalService','HistoryService')
          foreach ($svc in $services) {
              $backupDir = "C:\Comda\Wesign\Backups\$svc"
              $latest = Get-ChildItem $backupDir -Directory | Where-Object { $_.Name -match '^backup_' } | Sort-Object Name -Descending | Select-Object -First 1
              if ($latest) {
                  $target = "C:\Comda\Wesign\Sites\$svc"
                  # Save config
                  $savedConfigs = @{}
                  foreach ($cfg in @('appsettings.json','web.config')) {
                      $cfgPath = Join-Path $target $cfg
                      if (Test-Path $cfgPath) { $savedConfigs[$cfg] = Get-Content $cfgPath -Raw }
                  }
                  # Restore
                  Copy-Item "$($latest.FullName)\*" $target -Recurse -Force
                  # Restore config
                  foreach ($cfg in $savedConfigs.Keys) {
                      Set-Content -Path (Join-Path $target $cfg) -Value $savedConfigs[$cfg] -NoNewline
                  }
                  Write-Host "Restored: $svc from $($latest.Name)"
              } else {
                  Write-Warning "No backup found for $svc"
              }
          }

          # Start pools
          foreach ($pool in $pools) { Start-WebAppPool -Name $pool }
          Write-Host 'Rollback complete'
          PSEOF

          SCRIPT_KEY="deploy/scripts/${{ github.run_id }}/app2-rollback-backend.ps1"
          aws s3 cp /tmp/rollback-backend.ps1 "s3://$BUCKET/$SCRIPT_KEY"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters "{\"commands\":[\"aws s3 cp s3://$BUCKET/$SCRIPT_KEY C:\\\\Temp\\\\script.ps1 --region $AWS_REGION; powershell -ExecutionPolicy Bypass -File C:\\\\Temp\\\\script.ps1\"]}" \
            --region "$AWS_REGION" \
            --timeout-seconds 600 \
            --query "Command.CommandId" --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "InProgress")
            STATUS=$(echo "$STATUS" | tr -d '\r')

            if [ "$STATUS" = "Success" ]; then
              echo "=== Output ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "SSM command failed: $STATUS"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardErrorContent" --output text
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              exit 1
            fi
            sleep 10
          done

          [ "$STATUS" != "Success" ] && echo "Timed out waiting for SSM command" && exit 1

      - name: "SSM: Rollback user-client"
        if: ${{ inputs.component == 'user-client' || inputs.component == 'all' }}
        run: |
          cat > /tmp/rollback-frontend.ps1 << 'PSEOF'
          $component = 'UserFrontend'
          $backupDir = "C:\Comda\Wesign\Backups\$component"
          $target = "C:\Comda\Wesign\Sites\$component"
          $latest = Get-ChildItem $backupDir -Directory | Where-Object { $_.Name -match '^backup_' } | Sort-Object Name -Descending | Select-Object -First 1
          if ($latest) {
              Copy-Item "$($latest.FullName)\*" $target -Recurse -Force
              Write-Host "Restored: $component from $($latest.Name)"
          } else {
              Write-Error "No backup found for $component"
              exit 1
          }
          PSEOF

          SCRIPT_KEY="deploy/scripts/${{ github.run_id }}/app2-rollback-user-client.ps1"
          aws s3 cp /tmp/rollback-frontend.ps1 "s3://$BUCKET/$SCRIPT_KEY"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters "{\"commands\":[\"aws s3 cp s3://$BUCKET/$SCRIPT_KEY C:\\\\Temp\\\\script.ps1 --region $AWS_REGION; powershell -ExecutionPolicy Bypass -File C:\\\\Temp\\\\script.ps1\"]}" \
            --region "$AWS_REGION" \
            --timeout-seconds 300 \
            --query "Command.CommandId" --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "InProgress")
            STATUS=$(echo "$STATUS" | tr -d '\r')

            if [ "$STATUS" = "Success" ]; then
              echo "=== Output ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "SSM command failed: $STATUS"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardErrorContent" --output text
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              exit 1
            fi
            sleep 10
          done

          [ "$STATUS" != "Success" ] && echo "Timed out waiting for SSM command" && exit 1

      - name: "SSM: Rollback mgmt-client"
        if: ${{ inputs.component == 'mgmt-client' || inputs.component == 'all' }}
        run: |
          cat > /tmp/rollback-frontend.ps1 << 'PSEOF'
          $component = 'ManagementFrontend'
          $backupDir = "C:\Comda\Wesign\Backups\$component"
          $target = "C:\Comda\Wesign\Sites\$component"
          $latest = Get-ChildItem $backupDir -Directory | Where-Object { $_.Name -match '^backup_' } | Sort-Object Name -Descending | Select-Object -First 1
          if ($latest) {
              Copy-Item "$($latest.FullName)\*" $target -Recurse -Force
              Write-Host "Restored: $component from $($latest.Name)"
          } else {
              Write-Error "No backup found for $component"
              exit 1
          }
          PSEOF

          SCRIPT_KEY="deploy/scripts/${{ github.run_id }}/app2-rollback-mgmt-client.ps1"
          aws s3 cp /tmp/rollback-frontend.ps1 "s3://$BUCKET/$SCRIPT_KEY"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters "{\"commands\":[\"aws s3 cp s3://$BUCKET/$SCRIPT_KEY C:\\\\Temp\\\\script.ps1 --region $AWS_REGION; powershell -ExecutionPolicy Bypass -File C:\\\\Temp\\\\script.ps1\"]}" \
            --region "$AWS_REGION" \
            --timeout-seconds 300 \
            --query "Command.CommandId" --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "InProgress")
            STATUS=$(echo "$STATUS" | tr -d '\r')

            if [ "$STATUS" = "Success" ]; then
              echo "=== Output ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "SSM command failed: $STATUS"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardErrorContent" --output text
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              exit 1
            fi
            sleep 10
          done

          [ "$STATUS" != "Success" ] && echo "Timed out waiting for SSM command" && exit 1

      - name: "SSM: Rollback signer-client"
        if: ${{ inputs.component == 'signer-client' || inputs.component == 'all' }}
        run: |
          cat > /tmp/rollback-frontend.ps1 << 'PSEOF'
          $component = 'SignerFrontend'
          $backupDir = "C:\Comda\Wesign\Backups\$component"
          $target = "C:\Comda\Wesign\Sites\$component"
          $latest = Get-ChildItem $backupDir -Directory | Where-Object { $_.Name -match '^backup_' } | Sort-Object Name -Descending | Select-Object -First 1
          if ($latest) {
              Copy-Item "$($latest.FullName)\*" $target -Recurse -Force
              Write-Host "Restored: $component from $($latest.Name)"
          } else {
              Write-Error "No backup found for $component"
              exit 1
          }
          PSEOF

          SCRIPT_KEY="deploy/scripts/${{ github.run_id }}/app2-rollback-signer-client.ps1"
          aws s3 cp /tmp/rollback-frontend.ps1 "s3://$BUCKET/$SCRIPT_KEY"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters "{\"commands\":[\"aws s3 cp s3://$BUCKET/$SCRIPT_KEY C:\\\\Temp\\\\script.ps1 --region $AWS_REGION; powershell -ExecutionPolicy Bypass -File C:\\\\Temp\\\\script.ps1\"]}" \
            --region "$AWS_REGION" \
            --timeout-seconds 300 \
            --query "Command.CommandId" --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "InProgress")
            STATUS=$(echo "$STATUS" | tr -d '\r')

            if [ "$STATUS" = "Success" ]; then
              echo "=== Output ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "SSM command failed: $STATUS"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardErrorContent" --output text
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              exit 1
            fi
            sleep 10
          done

          [ "$STATUS" != "Success" ] && echo "Timed out waiting for SSM command" && exit 1

      - name: "SSM: Health check"
        run: |
          cat > /tmp/healthcheck.ps1 << 'PSEOF'
          $ErrorActionPreference = 'Stop'
          $endpoints = @(
              @{Name='UserBackend'; Url='https://localhost/userApi/'},
              @{Name='SignerBackend'; Url='https://localhost/signerApi/'},
              @{Name='ManagementBackend'; Url='https://localhost:10443/managementApi/'},
              @{Name='WSEAuth'; Url='https://localhost/auth/'}
          )
          $maxRetries = 12
          $failed = @()
          foreach ($ep in $endpoints) {
              $ok = $false
              for ($i = 1; $i -le $maxRetries; $i++) {
                  try {
                      $r = Invoke-WebRequest -Uri $ep.Url -UseBasicParsing -TimeoutSec 10 -SkipCertificateCheck
                      if ($r.StatusCode -lt 500) { $ok = $true; Write-Host "$($ep.Name): OK (HTTP $($r.StatusCode))"; break }
                  } catch { Write-Host "$($ep.Name) attempt ${i}: $_" }
                  Start-Sleep -Seconds 5
              }
              if (-not $ok) { $failed += $ep.Name }
          }
          if ($failed.Count -gt 0) { Write-Error "Health check failed: $($failed -join ', ')"; exit 1 }
          Write-Host 'All health checks passed'
          PSEOF

          SCRIPT_KEY="deploy/scripts/${{ github.run_id }}/app2-rollback-healthcheck.ps1"
          aws s3 cp /tmp/healthcheck.ps1 "s3://$BUCKET/$SCRIPT_KEY"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters "{\"commands\":[\"aws s3 cp s3://$BUCKET/$SCRIPT_KEY C:\\\\Temp\\\\script.ps1 --region $AWS_REGION; powershell -ExecutionPolicy Bypass -File C:\\\\Temp\\\\script.ps1\"]}" \
            --region "$AWS_REGION" \
            --timeout-seconds 300 \
            --query "Command.CommandId" --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "InProgress")
            STATUS=$(echo "$STATUS" | tr -d '\r')

            if [ "$STATUS" = "Success" ]; then
              echo "=== Output ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "SSM command failed: $STATUS"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardErrorContent" --output text
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              exit 1
            fi
            sleep 10
          done

          [ "$STATUS" != "Success" ] && echo "Timed out waiting for SSM command" && exit 1

      - name: Register APP2 in target groups
        run: |
          echo "Registering APP2 in TG_APP (port 80)..."
          aws elbv2 register-targets \
            --target-group-arn "${{ vars.TG_APP_ARN }}" \
            --targets "Id=${{ vars.APP2_INSTANCE_ID }},Port=80"

          echo "Registering APP2 in TG_HTTPS (port 443)..."
          aws elbv2 register-targets \
            --target-group-arn "${{ vars.TG_HTTPS_ARN }}" \
            --targets "Id=${{ vars.APP2_INSTANCE_ID }},Port=443"

          echo "Registering APP2 in TG_MGMT (port 10443)..."
          aws elbv2 register-targets \
            --target-group-arn "${{ vars.TG_MGMT_ARN }}" \
            --targets "Id=${{ vars.APP2_INSTANCE_ID }},Port=10443"

      - name: Wait for APP2 to become healthy
        run: |
          echo "Waiting for APP2 to become healthy in target groups..."
          for TG in "${{ vars.TG_APP_ARN }}" "${{ vars.TG_HTTPS_ARN }}" "${{ vars.TG_MGMT_ARN }}"; do
            for attempt in $(seq 1 30); do
              HEALTH=$(aws elbv2 describe-target-health \
                --target-group-arn "$TG" \
                --targets "Id=${{ vars.APP2_INSTANCE_ID }}" \
                --query "TargetHealthDescriptions[0].TargetHealth.State" \
                --output text 2>/dev/null || echo "unknown")
              if [ "$HEALTH" = "healthy" ]; then
                echo "APP2 healthy in $TG"
                break
              fi
              echo "  Attempt $attempt: $HEALTH - waiting..."
              sleep 10
            done
            if [ "$HEALTH" != "healthy" ]; then
              echo "WARNING: APP2 not healthy in $TG after 5 minutes (status: $HEALTH)"
            fi
          done

  # ============================================================
  # Job 4: Send notification with rollback results
  # ============================================================
  notify:
    name: Notify Teams
    runs-on: ubuntu-latest
    needs: [rollback-app1, rollback-app2]
    if: always()
    environment: wesigndev
    steps:
      - name: Send Teams notification
        run: |
          APP1_STATUS="${{ needs.rollback-app1.result }}"
          APP2_STATUS="${{ needs.rollback-app2.result }}"

          if [ "$APP1_STATUS" = "success" ] || [ "$APP1_STATUS" = "skipped" ]; then
            APP1_OK=true
          else
            APP1_OK=false
          fi

          if [ "$APP2_STATUS" = "success" ] || [ "$APP2_STATUS" = "skipped" ]; then
            APP2_OK=true
          else
            APP2_OK=false
          fi

          if [ "$APP1_OK" = "true" ] && [ "$APP2_OK" = "true" ]; then
            STATUS_TEXT="Succeeded"
            STATUS_ICON="&#x2705;"
          else
            STATUS_TEXT="Failed"
            STATUS_ICON="&#x274C;"
          fi

          cat > /tmp/teams-card.json << JSONEOF
          {
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.4",
                  "body": [
                    {
                      "type": "TextBlock",
                      "size": "Large",
                      "weight": "Bolder",
                      "text": "${STATUS_ICON} WeSign Rollback: ${STATUS_TEXT}"
                    },
                    {
                      "type": "FactSet",
                      "facts": [
                        {"title": "Component", "value": "${{ inputs.component }}"},
                        {"title": "Server", "value": "${{ inputs.server }}"},
                        {"title": "Triggered by", "value": "${{ github.actor }}"},
                        {"title": "APP1", "value": "${APP1_STATUS}"},
                        {"title": "APP2", "value": "${APP2_STATUS}"}
                      ]
                    }
                  ],
                  "actions": [
                    {
                      "type": "Action.OpenUrl",
                      "title": "View Run",
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              }
            ]
          }
          JSONEOF

          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d @/tmp/teams-card.json \
            "${{ secrets.TEAMS_WEBHOOK_URL }}" || echo "WARNING: Teams notification failed"
